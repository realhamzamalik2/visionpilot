[project]
name = "visionpilot-api"
version = "0.1.0"
description = "VisionPilot agent backend: FastAPI + Gemini planner + VisionPilot MCP vision tools, with a streamed trace"
readme = "README.md"
authors = [
    { name = "Hamza Ghulam Nabi", email = "realhamzamalik@gmail.com" }
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "google-genai>=2.14",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pillow>=11",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.0",
]

[project.scripts]
visionpilot-api = "visionpilot_api:main"
visionpilot-ask = "visionpilot_api.cli:main"
visionpilot-eval = "visionpilot_api.evals:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
