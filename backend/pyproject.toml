[project]
name = "visionpilot-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "realhamzamalik2", email = "realhamzamalik@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "google-genai>=2.14",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.0",
    "tenacity>=9.1.4",
]

[project.scripts]
visionpilot-api = "visionpilot_api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
